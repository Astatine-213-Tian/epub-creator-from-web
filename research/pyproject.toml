[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "author-style-transfer-research"
version = "0.1.0"
description = "Dataset-first Chinese authorship and style-transfer research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "epub-creator-from-web",
    "joblib==1.5.3",
    "numpy==2.4.6",
    "scikit-learn==1.7.2",
    "scipy==1.17.1",
]

[project.scripts]
author-style-research = "workflows.cli:main"

[tool.uv.sources]
epub-creator-from-web = { path = "..", editable = true }

[tool.setuptools.packages.find]
include = ["experiments*", "tests*", "workflows*"]
